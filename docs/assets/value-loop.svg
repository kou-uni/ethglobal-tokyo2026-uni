<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" role="img" aria-label="Her decisions teach the router, so more runs without her and she can pull any of it back. Across many sellers the platform accumulates shape rather than content, and that aggregate is what could one day be useful to partners such as Curvegrid. None of that last part is built.">
<rect width="100%" height="100%" fill="#F8F7F3"/>
<defs>
<marker id="vl-k" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#242329"/></marker>
<marker id="vl-r" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B5BD6"/></marker>
<marker id="vl-a" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B08900"/></marker>
</defs>
<style>
.vl-lnm{font:900 13px "M PLUS Rounded 1c",sans-serif;fill:#8C8998;letter-spacing:.11em}
.vl-h{font:900 26px "M PLUS Rounded 1c",sans-serif;fill:#241f3d}
.vl-t{font:900 19px "M PLUS Rounded 1c",sans-serif;fill:#242329}
.vl-b{font:800 15px "M PLUS Rounded 1c",sans-serif;fill:#5F5D6B}
.vl-m{font:900 13px ui-monospace,Menlo,monospace;fill:#6F9022}
.vl-mf{font:900 13px ui-monospace,Menlo,monospace;fill:#6B5BD6}
.vl-pill{font:900 12px "M PLUS Rounded 1c",sans-serif;fill:#fff;letter-spacing:.06em}
.vl-big{font:900 34px "M PLUS Rounded 1c",sans-serif;fill:#242329}
.vl-cap{font:800 13.5px "M PLUS Rounded 1c",sans-serif;fill:#8C8998}
</style>
<text class="vl-lnm" x="20" y="38">WHAT ACCUMULATES, AND WHAT COULD LEAVE</text>
<rect x="20" y="66" width="560" height="330" rx="26" fill="#fff" stroke="#E8E5DC" stroke-width="2"/>
<text class="vl-h" x="46" y="108">The loop, per person</text>
<circle cx="90" cy="148" r="17" fill="#6B5BD6"/>
<text class="vl-pill" x="85" y="153">1</text>
<text class="vl-t" x="122" y="154">She answers</text>
<text class="vl-b" x="122" y="178">Yes, no, never again. Each one is a</text>
<text class="vl-b" x="122" y="199">judgement the rules could not make.</text>
<circle cx="90" cy="234" r="17" fill="#6B5BD6"/>
<text class="vl-pill" x="85" y="239">2</text>
<text class="vl-t" x="122" y="240">The router learns the shape</text>
<text class="vl-b" x="122" y="264">Not her words — which categories, which</text>
<text class="vl-b" x="122" y="285">askers, which prices she keeps refusing.</text>
<circle cx="90" cy="320" r="17" fill="#6B5BD6"/>
<text class="vl-pill" x="85" y="325">3</text>
<text class="vl-t" x="122" y="326">More runs without her</text>
<text class="vl-b" x="122" y="350">And she can pull any of it back. The cap</text>
<text class="vl-b" x="122" y="371">is hers; so is every rule it learned.</text>
<path d="M62 372 L62 134" stroke="#6B5BD6" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#vl-r)"/>
<text class="vl-b" transform="rotate(-90 42 253)" x="42" y="253" text-anchor="middle">and it comes back round</text>
<rect x="612" y="66" width="388" height="330" rx="26" fill="#EDE9FF" stroke="#C9BFFF" stroke-width="2"/>
<text class="vl-h" x="638" y="108">What only a platform</text>
<text class="vl-h" x="638" y="140">can see</text>
<text class="vl-b" x="638" y="174">One seller has a habit. Many sellers,</text>
<text class="vl-b" x="638" y="195">across a market, have a distribution.</text>
<text class="vl-mf" x="638" y="228">&#183; what agents are willing to pay for</text>
<text class="vl-mf" x="638" y="252">&#183; which requests get refused, and why</text>
<text class="vl-mf" x="638" y="276">&#183; which prices actually clear</text>
<text class="vl-mf" x="638" y="300">&#183; how often a human is really needed</text>
<text class="vl-b" x="638" y="342">Her answers are not in there. The</text>
<text class="vl-b" x="638" y="363">shape of the demand is.</text>
<path d="M584 230 L606 230" stroke="#242329" stroke-width="3" fill="none" marker-end="url(#vl-k)"/>
<rect x="20" y="424" width="980" height="172" rx="26" fill="#FFF6DC" stroke="#F0DFA8" stroke-width="2"/>
<rect x="46" y="448" width="212" height="26" rx="13" fill="#B08900"/>
<text class="vl-pill" x="62" y="466">NOT BUILT &#183; A DIRECTION</text>
<text class="vl-h" x="280" y="470">Where that bundle could go</text>
<text class="vl-b" x="46" y="504">An agent treasury has to answer a question we are collecting the evidence for: which of an</text>
<text class="vl-b" x="46" y="526">agent’s money movements needed a person, and how often. That is what the distribution above is,</text>
<text class="vl-b" x="46" y="548">and a partner working on agent finances — Curvegrid, for instance — would want it as a feed.</text>
<text class="vl-b" x="46" y="570">It does not exist. No aggregate is computed, nothing is shared, and there is no agreement to.</text>
</svg>