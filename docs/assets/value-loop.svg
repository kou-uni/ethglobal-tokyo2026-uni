<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 452" role="img" aria-label="Her answers teach the router, so more runs without her and she can pull it back. Across a market the platform sees a distribution rather than anyone's content, which an agent treasury would want. That last part is not built.">
<rect width="100%" height="100%" fill="#F8F7F3"/>
<defs>
<marker id="vl-k" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#242329"/></marker>
<marker id="vl-r" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B5BD6"/></marker>
</defs>
<style>
.vl-lnm{font:900 13px "M PLUS Rounded 1c",sans-serif;fill:#8C8998;letter-spacing:.11em}
.vl-h{font:900 27px "M PLUS Rounded 1c",sans-serif;fill:#241f3d}
.vl-t{font:900 21px "M PLUS Rounded 1c",sans-serif;fill:#242329}
.vl-b{font:800 16px "M PLUS Rounded 1c",sans-serif;fill:#5F5D6B}
.vl-m{font:900 14px ui-monospace,Menlo,monospace;fill:#6F9022}
.vl-mf{font:900 14px ui-monospace,Menlo,monospace;fill:#6B5BD6}
.vl-pill{font:900 12px "M PLUS Rounded 1c",sans-serif;fill:#fff;letter-spacing:.06em}
.vl-cap{font:800 14px "M PLUS Rounded 1c",sans-serif;fill:#8C8998}
</style>
<text class="vl-lnm" x="20" y="36">WHAT ACCUMULATES</text>
<rect x="20" y="62" width="560" height="224" rx="26" fill="#fff" stroke="#E8E5DC" stroke-width="2"/>
<circle cx="92" cy="100" r="18" fill="#6B5BD6"/>
<text class="vl-pill" x="87" y="105">1</text>
<text class="vl-t" x="128" y="107">She answers</text>
<circle cx="92" cy="162" r="18" fill="#6B5BD6"/>
<text class="vl-pill" x="87" y="167">2</text>
<text class="vl-t" x="128" y="169">It learns the shape</text>
<circle cx="92" cy="224" r="18" fill="#6B5BD6"/>
<text class="vl-pill" x="87" y="229">3</text>
<text class="vl-t" x="128" y="231">More runs without her</text>
<path d="M62 262 L62 96" stroke="#6B5BD6" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#vl-r)"/>
<text class="vl-b" transform="rotate(-90 42 180)" x="42" y="180" text-anchor="middle">she can pull it back</text>
<rect x="612" y="62" width="388" height="224" rx="26" fill="#EDE9FF" stroke="#C9BFFF" stroke-width="2"/>
<text class="vl-h" x="640" y="104">A market has a shape</text>
<text class="vl-mf" x="640" y="140">&#183; what agents pay for</text>
<text class="vl-mf" x="640" y="166">&#183; what gets refused</text>
<text class="vl-mf" x="640" y="192">&#183; which prices clear</text>
<text class="vl-mf" x="640" y="218">&#183; how often a person is needed</text>
<text class="vl-b" x="640" y="264">Her answers are not in it.</text>
<path d="M584 174 L606 174" stroke="#242329" stroke-width="3" fill="none" marker-end="url(#vl-k)"/>
<rect x="20" y="312" width="980" height="120" rx="26" fill="#FFF6DC" stroke="#F0DFA8" stroke-width="2"/>
<rect x="46" y="338" width="106" height="26" rx="13" fill="#B08900"/>
<text class="vl-pill" x="62" y="356">NOT BUILT</text>
<text class="vl-h" x="174" y="360">Where it could go</text>
<text class="vl-b" x="46" y="396">An agent treasury needs this.</text>
<text class="vl-b" x="46" y="418">Curvegrid, for one. Nothing shared.</text>
</svg>