<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600" role="img" aria-label="Agents send about fifty requests; Yohaku passes two to the person. ENSv2, World ID, intercepta and x402 attach to Yohaku, and the money it releases lands in a treasury layer.">
<defs>
<linearGradient id="mp-bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#E4EDFF"/><stop offset="55%" stop-color="#F2EBFF"/><stop offset="1" stop-color="#FFE7F4"/>
</linearGradient>
<radialGradient id="mp-glow" cx="50%" cy="34%" r="52%">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</radialGradient>
</defs>
<style>
.mp-n{font:900 30px "M PLUS Rounded 1c",sans-serif;fill:#2B2740}
.mp-c{font:900 42px "M PLUS Rounded 1c",sans-serif;fill:#fff}
.mp-num{font:900 36px "M PLUS Rounded 1c",sans-serif;fill:#3B6FE0}
.mp-num.p{fill:#DE3F97}
.mp-p{font:900 21px "M PLUS Rounded 1c",sans-serif;fill:#2B2740}
.mp-s{font:800 16px "M PLUS Rounded 1c",sans-serif;fill:#9A93B8}
</style>
<rect width="100%" height="100%" fill="url(#mp-bg)"/>
<rect width="100%" height="100%" fill="url(#mp-glow)"/>
<rect x="20" y="150" width="250" height="120" rx="30" fill="#FFFFFF" fill-opacity=".72"/>
<text class="mp-n" x="48" y="222">&#129302; Agents</text>
<rect x="385" y="118" width="250" height="184" rx="34" fill="#5B4BE0"/>
<text class="mp-c" x="418" y="226">Yohaku</text>
<rect x="750" y="150" width="250" height="120" rx="30" fill="#FFFFFF" fill-opacity=".72"/>
<text class="mp-n" x="778" y="222">&#128100; A person</text>
<rect x="286" y="203" width="78" height="9" rx="4.5" fill="#3B6FE0"/>
<path d="M364 195 L386 207.5 L364 220 z" fill="#3B6FE0"/>
<rect x="651" y="201" width="66" height="13" rx="6.5" fill="#DE3F97"/>
<path d="M717 192 L741 207.5 L717 223 z" fill="#DE3F97"/>
<text class="mp-num" x="292" y="180">52</text>
<text class="mp-num p" x="672" y="180">2</text>
<text class="mp-s" x="452" y="350">it plugs into</text>
<rect x="20" y="372" width="215" height="70" rx="24" fill="#FFFFFF" fill-opacity=".66"/>
<text class="mp-p" x="44" y="415">&#9939; ENSv2</text>
<path d="M127 372 C 127 344, 510 336, 510 306" stroke="#C9C2E8" stroke-width="2" fill="none" stroke-opacity=".8"/>
<rect x="275" y="372" width="215" height="70" rx="24" fill="#FFFFFF" fill-opacity=".66"/>
<text class="mp-p" x="299" y="415">&#127757; World ID</text>
<path d="M382 372 C 382 344, 510 336, 510 306" stroke="#C9C2E8" stroke-width="2" fill="none" stroke-opacity=".8"/>
<rect x="530" y="372" width="215" height="70" rx="24" fill="#FFFFFF" fill-opacity=".66"/>
<text class="mp-p" x="554" y="415">&#128737; intercepta</text>
<path d="M637 372 C 637 344, 510 336, 510 306" stroke="#C9C2E8" stroke-width="2" fill="none" stroke-opacity=".8"/>
<rect x="785" y="372" width="215" height="70" rx="24" fill="#FFFFFF" fill-opacity=".66"/>
<text class="mp-p" x="809" y="415">&#128176; x402</text>
<path d="M892 372 C 892 344, 510 336, 510 306" stroke="#C9C2E8" stroke-width="2" fill="none" stroke-opacity=".8"/>
<rect x="504" y="442" width="13" height="50" rx="6.5" fill="#DE3F97"/>
<path d="M495 490 L510.5 514 L526 490 z" fill="#DE3F97"/>
<rect x="330" y="522" width="360" height="72" rx="26" fill="#FFFFFF" fill-opacity=".58"/>
<text class="mp-p" x="358" y="566">&#128202; a treasury</text>
</svg>